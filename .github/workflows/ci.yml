# Builds and tests every pull request (PlaceChat Technical Design §9.5).
# The three job names are required status checks in the protect-main ruleset, so keep them
# stable, and never add a `paths:` filter: a required check that does not run blocks the merge.
name: ci

on:
  pull_request:
  push:
    branches: [main, release]

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: placechat_pbi07_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d placechat_pbi07_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/placechat_pbi07_tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e .
        working-directory: backend
      - run: python scripts/export_openapi.py ../frontend/openapi.json
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run api-types
        working-directory: frontend
      - name: Check that the committed API types are up to date
        run: |
          if ! git diff --exit-code -- frontend/src/lib/api-types.ts; then
            echo "::error file=frontend/src/lib/api-types.ts::API types are out of date. Run the two commands under 'API types' in frontend/README.md and commit the result."
            exit 1
          fi
